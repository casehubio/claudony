name: Build and Publish

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-published]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout casehub-pages
        uses: actions/checkout@v4
        with:
          repository: casehubio/casehub-pages
          path: .ci-deps/pages

      - name: Checkout blocks-ui
        uses: actions/checkout@v4
        with:
          repository: casehubio/blocks-ui
          path: .ci-deps/blocks-ui

      - name: Create sibling symlinks for file: dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/.ci-deps/pages" "$GITHUB_WORKSPACE/../pages"
          ln -s "$GITHUB_WORKSPACE/.ci-deps/blocks-ui" "$GITHUB_WORKSPACE/../blocks-ui"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'

      - name: Build pages packages
        working-directory: .ci-deps/pages
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Build blocks-ui packages
        working-directory: .ci-deps/blocks-ui
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Build frontend
        working-directory: app/src/main/webui
        run: npm install && npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: mvn --batch-mode verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test, and publish
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 5
