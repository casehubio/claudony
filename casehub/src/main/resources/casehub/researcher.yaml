dsl: "0.1"
namespace: claudony
name: researcher
version: "1.0.0"
title: "Researcher Case"
spec:
  capabilities:
    - name: researcher
      description: "Claude Code research worker started as a tmux session via Claudony"
      inputSchema: "{}"
      outputSchema: "{}"
  bindings:
    - name: start-session-on-init
      capability: researcher
      on:
        contextChange: {}
      when: ".workers.researcher.started != true and .workers.researcher.exited != true"
  goals:
    - name: research-complete
      condition: ".workers.researcher.exited == true"
      kind: success
  completion:
    success:
      allOf:
        - research-complete
