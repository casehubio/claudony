<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RemoteCC — Sign In</title>
  <link rel="stylesheet" href="/pages/tokens/casehub-dark.css">
  <script type="module" src="/pages/ui/components.js"></script>
  <style>
    body { font-family: var(--pages-font-family, system-ui, sans-serif); background: var(--pages-neutral-1);
           color: var(--pages-neutral-11); display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .card { background: var(--pages-neutral-2); border-radius: var(--pages-radius-lg, 12px); padding: 2rem;
            width: 320px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 1.5rem; font-size: 1.4rem; color: var(--pages-neutral-12); }
    .error { color: var(--pages-danger-9); font-size: 0.85rem; margin-top: 0.75rem; display: none; }
    .hint { font-size: 0.8rem; color: var(--pages-neutral-8); margin-top: 1rem; text-align: center; }
    pages-button { display: block; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>RemoteCC</h1>
  <pages-input id="username" label="Username" placeholder="Your name" type="text" autocomplete="username webauthn"></pages-input>
  <pages-button label="Sign in with Passkey" variant="primary" onclick="login()"></pages-button>
  <div class="error" id="error"></div>
  <p class="hint">Use Touch ID or Face ID to authenticate.</p>
</div>
<script>
function b64uToBuffer(b64u) {
  const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return buf;
}

function bufToB64u(buf) {
  const u8 = new Uint8Array(buf);
  let bin = '';
  u8.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function login() {
  const err = document.getElementById('error');
  err.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  if (!username) { showError('Enter your username'); return; }

  try {
    const optRes = await fetch('/q/webauthn/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: username})
    });
    if (!optRes.ok) { showError('User not found or server error'); return; }
    const opts = await optRes.json();

    opts.challenge = b64uToBuffer(opts.challenge);
    if (opts.allowCredentials) {
      opts.allowCredentials = opts.allowCredentials.map(c => ({...c, id: b64uToBuffer(c.id)}));
    }

    const cred = await navigator.credentials.get({publicKey: opts});

    const body = {
      id: cred.id,
      rawId: bufToB64u(cred.rawId),
      response: {
        authenticatorData: bufToB64u(cred.response.authenticatorData),
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        signature: bufToB64u(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null
      },
      type: cred.type
    };

    const finishRes = await fetch('/q/webauthn/callback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (finishRes.ok) {
      window.location.href = '/app/';
    } else {
      showError('Authentication failed — try again');
    }
  } catch (e) {
    showError(e.name === 'NotAllowedError' ? 'Cancelled or no passkey available' : e.message);
  }
}

function showError(msg) {
  const err = document.getElementById('error');
  err.textContent = msg;
  err.style.display = 'block';
}
</script>
</body>
</html>
