# Use random port to avoid conflicts when tests are run repeatedly
quarkus.http.test-port=0

# casehub-qhorus 0.2-SNAPSHOT embeds application.properties with casehub.qhorus.* defaults
# that Quarkus strict config validation rejects as unmapped (SRCFG00050) when the
# extension's @ConfigMapping root isn't registered during augmentation. Suppress until
# casehub-qhorus fixes its extension descriptor. See docs/BUGS-AND-ODDITIES.md.
smallrye.config.mapping.validate-unknown=false
# Point the agent's ServerClient back at the test server — avoids connection-refused
# failures in McpServerIntegrationTest when the server URL stays at the default 7777
%test.claudony.server.url=http://localhost:${quarkus.http.port}

# Index qhorus-testing jar so InMemory*Store CDI beans are discoverable
%test.quarkus.index-dependency.qhorus-testing.group-id=io.casehub
%test.quarkus.index-dependency.qhorus-testing.artifact-id=casehub-qhorus-testing
# Index casehub-testing jar so TestCaseInstanceRepository, TestEventLogRepository,
# TestCaseMetaModelRepository (@Alternative @Priority(1)) are discoverable
%test.quarkus.index-dependency.casehub-testing.group-id=io.casehub
%test.quarkus.index-dependency.casehub-testing.artifact-id=casehub-testing
# casehub-engine self-indexes its runtime module via its embedded application.properties.
# Beans in that module inject JQEvaluator from casehub-engine-common — index it so CDI
# can satisfy the injection (the beans themselves are still excluded via exclude-types).
%test.quarkus.index-dependency.engine-common.group-id=io.casehub
%test.quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
# casehub-testing transitively brings casehub-persistence-memory onto the Jandex
# index (engine is excluded in app/pom.xml to avoid a duplicate ledger extension).
# casehub-persistence-memory's InMemory* beans are abstract parent types — indexing
# them as standalone CDI beans causes deployment errors. WorkResultSubmitter (from
# casehub-testing itself) injects CaseDefinitionRegistry which is not available in
# the Claudony test context. Exclude both; keep the existing ledger bean exclusions.
# Pre-existing ledger exclusions (conflict with quarkus-ledger's repository layer):
#   io.casehub.ledger.repository.CaseLedgerEntryRepository,
#   io.casehub.ledger.service.CaseLedgerEventCapture,
#   io.casehub.ledger.service.WorkerDecisionEventCapture (injects CaseLedgerEntryRepository — excluded here too)
# engine#349 (close five signal gaps): new bridge bean injects CaseHubRuntime — no impl in default test profile:
#   io.casehub.engine.internal.bridge.QhorusMessageSignalBridge
# casehub-persistence-memory abstract parents (indexed transitively, cause CDI deployment errors):
#   io.casehub.persistence.memory.InMemory*
# casehub-testing direct (WorkResultSubmitter injects CaseDefinitionRegistry — not in Claudony context):
#   io.casehub.testing.WorkResultSubmitter
# TestResearcherCase (default profile only): CaseHub superclass injects CaseHubRuntime, which is
#   not registered in the default test context. CasehubEnabledProfile overrides exclude-types
#   to re-include it for the round-trip test.
%test.quarkus.arc.exclude-types=io.casehub.ledger.repository.CaseLedgerEntryRepository,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture,\
  io.casehub.engine.internal.bridge.QhorusMessageSignalBridge,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.testing.WorkResultSubmitter,\
  io.casehub.claudony.TestResearcherCase,\
  io.casehub.engine.internal.engine.CaseHubRuntimeImpl,\
  io.casehub.engine.internal.engine.CaseHubReactor,\
  io.casehub.engine.internal.engine.ChoreographyLoopControl,\
  io.casehub.engine.internal.engine.DefaultCaseDefinitionRegistry,\
  io.casehub.engine.internal.engine.DefaultExpressionEngineRegistry,\
  io.casehub.engine.internal.engine.LambdaExpressionEngine,\
  io.casehub.engine.internal.engine.JQExpressionEngine,\
  io.casehub.engine.internal.engine.cache.CaseInstanceCacheImpl,\
  io.casehub.engine.internal.engine.handler.CaseContextChangedEventHandler,\
  io.casehub.engine.internal.engine.handler.CaseStartedEventHandler,\
  io.casehub.engine.internal.engine.handler.CaseStatusChangedHandler,\
  io.casehub.engine.internal.engine.handler.GoalReachedEventHandler,\
  io.casehub.engine.internal.engine.handler.MilestoneActivatedEventHandler,\
  io.casehub.engine.internal.engine.handler.MilestoneCompletedEventHandler,\
  io.casehub.engine.internal.engine.handler.MilestoneReachedEventHandler,\
  io.casehub.engine.internal.engine.handler.MilestoneSLAViolatedEventHandler,\
  io.casehub.engine.internal.engine.handler.SignalReceivedEventHandler,\
  io.casehub.engine.internal.engine.handler.WorkerRetriesExhaustedEventHandler,\
  io.casehub.engine.internal.engine.handler.WorkerScheduleEventHandler,\
  io.casehub.engine.internal.engine.handler.WorkflowExecutionCompletedHandler,\
  io.casehub.engine.internal.engine.recovery.DefaultWorkerExecutionRecoveryService,\
  io.casehub.engine.internal.marshaller.CaseHubObjectMapperProducer,\
  io.casehub.engine.internal.marshaller.ObjectMapperInjector,\
  io.casehub.engine.internal.milestone.MilestoneLifecycleManager,\
  io.casehub.engine.internal.orchestration.WorkOrchestrator,\
  io.casehub.engine.internal.scheduler.SchedulerService,\
  io.casehub.engine.internal.work.CaseResumptionService,\
  io.casehub.engine.internal.work.PendingWorkRegistry,\
  io.casehub.engine.internal.work.WorkCdi,\
  io.casehub.engine.internal.worker.CasehubWorkloadProvider,\
  io.casehub.engine.internal.worker.AllowAllWorkerExecutionGuard,\
  io.casehub.engine.internal.worker.ServerlessWorkflowExecutor,\
  io.casehub.work.core.strategy.RoundRobinStrategy

# Qhorus named datasource — in-memory H2 for tests (no file path, no AUTO_SERVER)
%test.quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:claudony-qhorus-test;DB_CLOSE_ON_EXIT=FALSE
# Reactive H2 client also needs an in-memory URL (no jdbc: prefix, no AUTO_SERVER)
%test.quarkus.datasource.qhorus.reactive.url=h2:mem:claudony-qhorus-test
# Flyway disabled in tests — schema managed by Hibernate database.generation instead
%test.quarkus.flyway.qhorus.migrate-at-start=false
%test.quarkus.hibernate-orm.qhorus.database.generation=drop-and-create

# Use events-only strategy in tests (no background heartbeat thread interference)
%test.claudony.case-worker-update=events-only
# Short heartbeat for hybrid strategy tests that exercise it explicitly
%test.claudony.case-worker-heartbeat-ms=200
# Short channel SSE heartbeat for tests — avoids 30s wait in channelEvents() SSE tests
%test.casehub.platform.preferences.defaults.claudony.channelHeartbeatIntervalSeconds=1

# PostgreSQL reactive profile — activated by ReactivePostgresTestProfile.
# PostgresTestResource (@QuarkusTestResource) starts a PostgreSQL container BEFORE
# Quarkus augmentation and provides the JDBC+reactive URLs at highest config priority,
# overriding the production H2 URLs. Flyway runs against real PostgreSQL.
%reactive-pg.quarkus.datasource.qhorus.db-kind=postgresql
%reactive-pg.quarkus.datasource.qhorus.reactive=true
%reactive-pg.quarkus.hibernate-orm.qhorus.database.generation=none
