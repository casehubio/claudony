# Use random port to avoid conflicts when tests are run repeatedly
quarkus.http.test-port=0

# casehub-qhorus 0.2-SNAPSHOT embeds application.properties with casehub.qhorus.* defaults
# that Quarkus strict config validation rejects as unmapped (SRCFG00050) when the
# extension's @ConfigMapping root isn't registered during augmentation. Suppress until
# casehub-qhorus fixes its extension descriptor. See docs/BUGS-AND-ODDITIES.md.
smallrye.config.mapping.validate-unknown=false
# Point the agent's ServerClient back at the test server — avoids connection-refused
# failures in McpServerIntegrationTest when the server URL stays at the default 7777
%test.claudony.server.url=http://localhost:${quarkus.http.port}

# Index qhorus-persistence-memory jar so InMemory*Store CDI beans are discoverable (qhorus#321)
%test.quarkus.index-dependency.qhorus-persistence-memory.group-id=io.casehub
%test.quarkus.index-dependency.qhorus-persistence-memory.artifact-id=casehub-qhorus-persistence-memory
# Index qhorus-testing jar so remaining test support beans are discoverable
%test.quarkus.index-dependency.qhorus-testing.group-id=io.casehub
%test.quarkus.index-dependency.qhorus-testing.artifact-id=casehub-qhorus-testing
# Index casehub-testing jar so TestCaseInstanceRepository, TestEventLogRepository,
# TestCaseMetaModelRepository (@Alternative @Priority(1)) are discoverable
%test.quarkus.index-dependency.casehub-testing.group-id=io.casehub
%test.quarkus.index-dependency.casehub-testing.artifact-id=casehub-testing
# casehub-engine self-indexes its runtime module via its embedded application.properties.
# Beans in that module inject JQEvaluator from casehub-engine-common — index it so CDI
# can satisfy the injection (the beans themselves are still excluded via exclude-types).
%test.quarkus.index-dependency.engine-common.group-id=io.casehub
%test.quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
# Engine internals, scheduler, connectors, and neocortex are excluded via glob patterns
# (io.casehub.engine.internal.**, etc.) — new engine SNAPSHOT beans get excluded
# automatically. CasehubEnabledProfile overrides this with a specific list that
# re-includes the beans it needs (CaseHubRuntimeImpl, handlers, etc.).
# Individual exclusions below are for non-engine beans:
#   ledger repository/services — conflict with quarkus-ledger's persistence layer
#   persistence-memory InMemory* — abstract parent types that fail CDI if indexed
#   WorkResultSubmitter — injects CaseDefinitionRegistry (not in Claudony context)
#   TestAgentCase/AgentCase/TestCompletionCase — inject CaseHubRuntime (default profile only)
#   CrossTenantProducer — qhorus bean needing EntityManager not available
%test.quarkus.arc.exclude-types=io.casehub.claudony.NoOpWorkerExecutionRecoveryService,\
  io.casehub.ledger.repository.CaseLedgerEntryRepository,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.testing.WorkResultSubmitter,\
  io.casehub.claudony.TestAgentCase,\
  io.casehub.claudony.casehub.AgentCase,\
  io.casehub.claudony.casehub.TestCompletionCase,\
  io.casehub.qhorus.runtime.identity.CrossTenantProducer,\
  io.casehub.work.core.**,\
  io.casehub.engine.internal.**,\
  io.casehub.engine.scheduler.**,\
  io.casehub.engine.trust.**,\
  io.casehub.connectors.**,\
  io.casehub.neocortex.**,\
  io.casehub.qhorus.runtime.store.jpa.**,\
  io.casehub.qhorus.runtime.api.A2AResource,\
  io.casehub.qhorus.runtime.api.AgentCardResource,\
  io.casehub.qhorus.runtime.api.CausalGraphResource,\
  io.casehub.qhorus.push.QhorusPushWebSocket,\
  io.casehub.qhorus.runtime.identity.QhorusInboundCurrentPrincipal,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture,\
  io.casehub.ledger.runtime.service.DefaultOutcomeRecorder,\
  io.casehub.ledger.runtime.service.intercept.AuditedInterceptor,\
  io.casehub.testing.TestWorkerProvisioner



# Qhorus named datasource — Dev Services auto-starts PostgreSQL container.
# Flyway inherits migrate-at-start=true from default profile.
%test.quarkus.hibernate-orm.qhorus.database.generation=update

# Use events-only strategy in tests (no background heartbeat thread interference)
%test.claudony.case-worker-update=events-only
# Short heartbeat for hybrid strategy tests that exercise it explicitly
%test.claudony.case-worker-heartbeat-ms=200
# Short channel SSE heartbeat for tests — avoids 30s wait in channelEvents() SSE tests
%test.casehub.platform.preferences.defaults.claudony.channelHeartbeatIntervalSeconds=1

# PostgreSQL reactive profile — activated by ReactivePostgresTestProfile.
# PostgresTestResource (@QuarkusTestResource) starts a PostgreSQL container BEFORE
# Quarkus augmentation and provides the JDBC+reactive URLs at highest config priority,
# overriding the production H2 URLs. Flyway runs against real PostgreSQL.
%reactive-pg.quarkus.datasource.qhorus.db-kind=postgresql
%reactive-pg.quarkus.datasource.qhorus.reactive=true
%reactive-pg.quarkus.hibernate-orm.qhorus.database.generation=none
